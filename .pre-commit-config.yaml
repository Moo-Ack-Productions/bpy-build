repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.18.2
  hooks:
    - id: mypy
      args: [--pretty]
      additional_dependencies: [
        "attrs==23.1.0",
        "pyyaml==6.0.1",
        "rich==13.7.0",
        "typeguard==4.1.5",
        "types-pyyaml==6.0.12.11",
        "GitPython==3.1.43",
        "tomli==2.0.1",
        "packaging==24.1"
      ]

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.4
  hooks:
    - id: ruff-check
    - id: ruff-check
      args: [--select, I, --fix]
    - id: ruff-format
